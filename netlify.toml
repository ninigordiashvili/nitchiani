# Netlify build config, kept in the repo rather than only in the dashboard so the settings
# travel with the code and can be reviewed like anything else.

[build]
  command = "npm run build"

[build.environment]
  # Netlify scans build output for the values of environment variables and fails the build
  # when it finds them, on the assumption a secret leaked. `NEXT_PUBLIC_*` values are meant
  # to be in the browser bundle — that is what the prefix means in Next.js — so finding them
  # there is correct, not a leak.
  #
  # Only these two are exempted, by name. Blanket-disabling the scan would also stop it
  # catching a genuine secret, which is the one thing it is for: the EchoDesk tenant URL and
  # the Maps key are both public by design, and the Maps key is protected by its HTTP
  # referrer allowlist rather than by being hidden.
  #
  # Anything without the NEXT_PUBLIC_ prefix — GOOGLE_MAPS_SERVER_KEY, the BOG and TBC
  # secrets — stays scanned, and must never appear in client output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_ECHODESK_API_URL,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"

# Optimised images are immutable in everything but name, but Netlify's Image CDN answers
# `cache-control: max-age=86400` and ignores the `minimumCacheTTL: 31536000` in next.config —
# so every product photo is re-fetched a day later, on a catalogue whose photos do not change.
#
# A transform URL names its source, width and quality, and EchoDesk's filenames carry their
# own upload timestamp, so a given URL always means the same bytes. Deliberately without
# `immutable`: the handful of `/public/categories/*.jpg` covers are addressed by a stable
# filename, and leaving revalidation-on-reload available is the cheap way to keep a
# replaced cover from being pinned for a year. If one of those is ever re-shot, rename it.
[[headers]]
  for = "/_next/image"
  [headers.values]
    cache-control = "public, max-age=31536000"
